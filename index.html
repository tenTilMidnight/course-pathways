<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#941120" />
    <meta name="description" content="Find courses and explore student pathways at Carnegie Mellon University." />
    <title>Search · Course Pathways</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#search-input">Skip to search</a>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Course Pathways home">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 25V18C7 12 25 20 25 8M7 25C7 19 16 20 16 11V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="25" r="3" fill="currentColor"/><circle cx="16" cy="6" r="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="25" cy="6" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Course Pathways</span>
        </a>
        <div class="university-badge">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 8L10 4L17 8M4 9H16M5.5 10V15M10 10V15M14.5 10V15M3 16H17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-university-name>Carnegie Mellon University</span>
          <span class="university-short" data-university-short>CMU</span>
        </div>
      </header>

      <main id="main-content">
        <section class="search-section" aria-labelledby="page-heading">
          <h1 id="page-heading" class="sr-only">Search</h1>

          <div class="search-area">
            <form id="search-form" novalidate role="search" aria-label="Search student pathways or courses">
              <label id="search-label" class="sr-only" for="search-input">Search Pathways</label>
              <div class="search-box" id="search-box">
                <button type="button" id="mode-toggle" class="mode-toggle" aria-label="Searching pathways. Switch to courses">
                  <svg id="mode-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 15V10C5 7 15 13 15 5M5 15C5 12 10 12 10 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="5" cy="15" r="2" stroke="currentColor" stroke-width="1.5"/><circle cx="15" cy="4" r="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
                  <span id="mode-name">Pathways</span>
                  <svg class="switch-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 5H13L10.5 2.5M13 11H3L5.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <input id="search-input" name="q" type="search" placeholder="Major or career direction" maxlength="120" autocomplete="off" spellcheck="false" aria-describedby="search-error" aria-controls="history-panel" aria-expanded="false" />
                <button type="button" id="clear-input" class="clear-input" aria-label="Clear search" hidden><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 6L14 14M14 6L6 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
                <button type="submit" id="search-submit" class="search-submit" aria-label="Search pathways"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.7"/><path d="M15 15L20 20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
              </div>
              <section id="history-panel" class="history-panel" aria-labelledby="history-heading" hidden>
                <div class="history-heading"><h2 id="history-heading">Recent pathway searches</h2><span id="storage-note">On this device</span></div>
                <ul id="history-list" class="history-list"></ul>
                <p id="history-empty" class="history-empty">No recent searches.</p>
              </section>
              <p id="search-error" class="search-error" role="alert" hidden></p>
            </form>

            <div class="examples" role="group" aria-label="Suggested searches">
              <div id="example-buttons" class="example-buttons"></div>
              <button type="button" id="refresh-examples" class="refresh-examples" aria-label="More suggestions" title="More suggestions">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 8A8 8 0 0 0 5.5 6L3 9M3 9V4M3 9H8M5 16A8 8 0 0 0 18.5 18L21 15M21 15V20M21 15H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <section id="search-summary" class="search-summary" aria-labelledby="summary-heading" hidden>
              <div class="summary-topline"><span class="summary-check" aria-hidden="true">✓</span><h2 id="summary-heading">Your search</h2><span id="summary-mode" class="summary-mode"></span></div>
              <p id="summary-query" class="summary-query"></p>
              <p class="summary-campus" data-university-name>Carnegie Mellon University</p>
              <div class="summary-bottom"><p id="summary-description">Search saved. Results not available yet.</p><button type="button" id="back-to-search">Back to search</button></div>
            </section>
          </div>

        </section>
      </main>

    </div>
    <div class="sr-only" id="announcements" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript><div class="noscript-message">Please enable JavaScript to switch search modes and use search history.</div></noscript>
  </body>
</html>
